<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Coffre — Martin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='80' font-size='80'%3E%F0%9F%94%90%3C/text%3E%3C/svg%3E" />
</head>
<body>
  <!-- Lock screen -->
  <div id="lock-screen" class="lock-screen">
    <div class="lock-card">
      <div class="lock-logo">
        <div class="lock-logo-icon">🔐</div>
        <h1>Coffre</h1>
        <p class="lock-subtitle">Entre ton mot de passe maître</p>
      </div>
      <form id="unlock-form" class="unlock-form">
        <div class="input-wrap">
          <input
            type="password"
            id="master-password"
            placeholder="Mot de passe maître"
            autocomplete="current-password"
            autofocus
            required
          />
          <button type="button" class="toggle-visibility" data-target="master-password" aria-label="Afficher">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
        <button type="submit" class="btn-primary btn-unlock">
          <span class="btn-label">Déverrouiller</span>
          <span class="btn-spinner" hidden></span>
        </button>
        <p id="unlock-error" class="error-msg" hidden></p>
      </form>
      <div class="lock-footer">
        <span class="dot"></span>
        Chiffrement AES-256-GCM · 250 000 itérations PBKDF2
      </div>
    </div>
  </div>

  <!-- Main app -->
  <div id="app" class="app" hidden>
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="brand">
          <div class="brand-logo">🔐</div>
          <div class="brand-text">
            <div class="brand-name">Coffre</div>
            <div class="brand-sub">Martin</div>
          </div>
        </div>
        <button class="icon-btn" id="sidebar-close" aria-label="Fermer">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>

      <nav class="categories" id="categories-nav">
        <button class="category-item active" data-category="all">
          <span class="category-icon">📁</span>
          <span class="category-name">Tout</span>
          <span class="category-count" id="count-all">0</span>
        </button>
      </nav>

      <div class="sidebar-footer">
        <button class="btn-ghost" id="lock-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          Verrouiller
        </button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="icon-btn sidebar-toggle" id="sidebar-open" aria-label="Menu">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <div class="search-wrap">
          <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="search" id="search" placeholder="Rechercher un service, email, note…" autocomplete="off" />
          <kbd class="kbd">⌘K</kbd>
        </div>
        <div class="topbar-actions">
          <span class="entry-count" id="entry-count-label"></span>
        </div>
      </header>

      <section class="content" id="content">
        <div class="empty-state" id="empty-state">
          <div class="empty-icon">🗝️</div>
          <h2>Ton coffre est vide</h2>
          <p>Envoie tes captures d'écran à Claude pour ajouter tes premiers comptes.</p>
        </div>
        <div class="entries-grid" id="entries-grid"></div>
      </section>
    </main>
  </div>

  <!-- Entry detail modal -->
  <div id="modal" class="modal" hidden>
    <div class="modal-backdrop" data-close-modal></div>
    <div class="modal-card" role="dialog" aria-modal="true">
      <header class="modal-header">
        <div class="modal-title">
          <div class="modal-icon" id="modal-icon">🔑</div>
          <div>
            <h3 id="modal-name">Service</h3>
            <p id="modal-category" class="modal-cat-pill">Catégorie</p>
          </div>
        </div>
        <button class="icon-btn" data-close-modal aria-label="Fermer">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </header>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <!-- Toast container -->
  <div id="toast-container" class="toast-container"></div>

  <script src="app.js"></script>
</body>
</html>
