<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Coffre" />

<meta name="robots" content="noindex, nofollow" />
<title>Coffre — Martin</title>

<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230a0e1a'/%3E%3Ctext y='75' x='50' text-anchor='middle' font-size='60'%3E%F0%9F%94%90%3C/text%3E%3C/svg%3E" />
<style>
*,*::before,*::after{box-sizing:border-box}*{margin:0;padding:0}[hidden]{display:none!important}
html,body{height:100%;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
body{font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  background:radial-gradient(ellipse 100% 60% at 20% 0%,#1a1438 0%,transparent 60%),
             radial-gradient(ellipse 100% 60% at 100% 100%,#0a2840 0%,transparent 55%),#07091a;
  color:#e8ecf4;-webkit-font-smoothing:antialiased;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button,input,textarea,select{font:inherit;color:inherit;background:none;border:0;outline:0}
button{cursor:pointer}input,textarea{-webkit-appearance:none;appearance:none}
a{color:#9ad4ff}
/* lock screen */
.lock{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;background:inherit;z-index:50}
.lock-card{width:100%;max-width:380px;text-align:center}
.lock-emoji{font-size:54px;line-height:1;margin-bottom:14px}
.lock h1{font-size:28px;font-weight:700;letter-spacing:-.02em}
.lock-sub{color:#8b95a8;margin:6px 0 28px;font-size:14px}
.field{position:relative;margin-bottom:14px}
.field input{width:100%;padding:16px 50px 16px 18px;border-radius:14px;background:#141b2d;
  border:1px solid #2a3552;font-size:16px;color:#fff;text-align:center}
.field input:focus{border-color:#7c5cff;background:#171f36}
.eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:40px;height:40px;
  display:flex;align-items:center;justify-content:center;color:#8b95a8;border-radius:10px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;
  width:100%;padding:15px;border-radius:13px;font-weight:600;font-size:15.5px;
  background:linear-gradient(135deg,#7c5cff 0%,#00d4ff 100%);color:#fff;
  box-shadow:0 8px 24px -8px rgba(124,92,255,.55)}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.6}
.btn.danger{background:linear-gradient(135deg,#ff5a6c 0%,#ff8855 100%);box-shadow:0 8px 24px -8px rgba(255,90,108,.55)}
.btn-2nd{display:flex;align-items:center;justify-content:center;width:100%;padding:15px;border-radius:13px;font-weight:600;font-size:15.5px;background:#1f2740;color:#cfd6e8}
.btn-2nd:active{background:#2a3552}
.err{color:#ff7585;font-size:13px;margin-top:10px;min-height:18px}
.lock-foot{color:#5d6779;font-size:12px;margin-top:24px}
/* app shell */
.app{display:flex;flex-direction:column;height:100vh;height:100dvh}
.topbar{padding:12px 14px 6px;border-bottom:1px solid rgba(255,255,255,.05);background:rgba(7,9,26,.85);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);position:sticky;top:0;z-index:10}
.tab-row{display:flex;gap:8px;align-items:center;margin-bottom:9px}
.tabs{display:flex;gap:4px;padding:3px;background:rgba(7,9,26,.5);border-radius:11px;flex:1}
.tab{flex:1;padding:8px;border-radius:8px;font-weight:600;font-size:13px;color:#8b95a8;transition:background .15s,color .15s}
.tab.active{background:linear-gradient(135deg,#7c5cff 0%,#00d4ff 100%);color:#fff;box-shadow:0 4px 12px -4px rgba(124,92,255,.5)}
.gear{width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:10px;background:rgba(7,9,26,.5);font-size:17px}
.gear:active{background:#1f2740}
.search-row{position:relative}
.search-row input{width:100%;padding:11px 16px 11px 40px;background:#141b2d;border:1px solid #2a3552;border-radius:11px;font-size:15px;color:#fff}
.search-row::before{content:"🔎";position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:14px;opacity:.6}
.cats{display:flex;gap:6px;padding:9px 14px 4px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;background:rgba(7,9,26,.55)}
.cats::-webkit-scrollbar{display:none}
.cat{flex-shrink:0;padding:7px 13px;border-radius:18px;background:#141b2d;border:1px solid #2a3552;font-size:13px;font-weight:500;color:#cfd6e8;white-space:nowrap}
.cat.active{background:linear-gradient(135deg,#7c5cff,#00d4ff);color:#fff;border-color:transparent}
.cat-n{opacity:.7;margin-left:6px;font-size:11px}
/* content */
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.list{padding:10px 14px 100px}
.empty{padding:60px 30px;text-align:center;color:#8b95a8}
.empty-i{font-size:46px;margin-bottom:10px}
.empty h2{color:#fff;font-size:18px;margin-bottom:6px}
.empty p{font-size:14px}
.card{background:linear-gradient(180deg,rgba(22,28,46,.85),rgba(18,23,39,.85));border:1px solid rgba(255,255,255,.05);border-radius:14px;margin-bottom:8px;overflow:hidden}
.card-head{display:flex;align-items:center;gap:12px;padding:13px 14px;width:100%;text-align:left}
.card-ico{width:38px;height:38px;display:flex;align-items:center;justify-content:center;background:rgba(124,92,255,.15);border-radius:10px;font-size:20px;flex-shrink:0}
.card-txt{flex:1;min-width:0}
.card-name{font-weight:600;font-size:15px;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-sub{color:#8b95a8;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
.chev{color:#5d6779;transition:transform .2s;flex-shrink:0;font-size:11px}
.card.open .chev{transform:rotate(180deg)}
.card-body{display:none;padding:10px 12px 12px;border-top:1px solid rgba(255,255,255,.05)}
.card.open .card-body{display:block;animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.row{background:rgba(7,9,26,.6);border-radius:10px;padding:10px 12px;margin-bottom:6px}
.row-lab{font-size:10px;font-weight:700;letter-spacing:.06em;color:#8b95a8;text-transform:uppercase;margin-bottom:4px}
.row-val{display:flex;align-items:center;gap:8px}
.row-val .v{flex:1;font-family:"SF Mono",Menlo,Consolas,monospace;font-size:13.5px;word-break:break-all;color:#e8ecf4;line-height:1.4}
.row-val.multi .v{white-space:pre-wrap}
.mini{padding:6px 10px;border-radius:8px;background:rgba(124,92,255,.18);color:#cfb6ff;font-size:11.5px;font-weight:600;flex-shrink:0}
.mini:active{background:rgba(124,92,255,.32)}
.mini.icon{padding:6px 8px}
.card-actions{display:flex;gap:8px;margin-top:10px}
.action{flex:1;padding:11px;border-radius:11px;font-weight:600;font-size:13.5px;background:#1f2740;color:#cfd6e8;display:flex;align-items:center;justify-content:center;gap:6px}
.action.edit{background:rgba(124,92,255,.22);color:#d9c9ff}
.action.danger{background:rgba(255,90,108,.18);color:#ffb1ba}
.action:active{transform:translateY(1px)}
/* attachments */
.att-list{display:flex;flex-direction:column;gap:6px;margin-top:2px}
.att{display:flex;align-items:center;gap:10px;padding:9px 11px;background:rgba(7,9,26,.6);border-radius:10px}
.att-ico{width:34px;height:34px;border-radius:8px;background:rgba(124,92,255,.18);display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;overflow:hidden}
.att-ico img{width:100%;height:100%;object-fit:cover}
.att-txt{flex:1;min-width:0}
.att-name{font-size:13px;color:#e8ecf4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.att-size{font-size:11px;color:#8b95a8;margin-top:1px}
.att-thumb{max-width:100%;border-radius:10px;margin-top:6px;display:block}
.att-form{display:flex;align-items:center;gap:10px;padding:9px 11px;background:#171f36;border:1px solid #2a3552;border-radius:10px;margin-bottom:6px}
.att-form .att-txt{overflow:hidden}
.att-rm{padding:6px 9px;border-radius:8px;background:rgba(255,90,108,.18);color:#ffb1ba;font-size:13px;flex-shrink:0}
.att-rm:active{background:rgba(255,90,108,.3)}
.att-add{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:12px;border:1px dashed #2a3552;border-radius:11px;color:#cfb6ff;font-weight:600;font-size:14px;background:transparent;margin-top:4px}
.att-add:active{background:rgba(124,92,255,.1);border-color:rgba(124,92,255,.5)}
/* planning */
.plan-head{padding:14px 16px 6px}
.plan-title{font-size:22px;font-weight:700;letter-spacing:-.02em}
.daily{margin:12px 0 4px;padding:11px 13px;background:linear-gradient(135deg,rgba(124,92,255,.14),rgba(0,212,255,.06));border:1px solid rgba(124,92,255,.22);border-radius:13px}
.daily-lab{font-size:10.5px;font-weight:700;letter-spacing:.06em;color:#b8c3e0;text-transform:uppercase;margin-bottom:7px}
.daily-tags{display:flex;flex-wrap:wrap;gap:6px}
.daily-tag{font-size:12px;padding:4px 10px;background:rgba(255,255,255,.06);border-radius:14px}
.days{padding:8px 14px 100px}
.day{background:linear-gradient(180deg,rgba(22,28,46,.85),rgba(18,23,39,.85));border:1px solid rgba(255,255,255,.05);border-top:3px solid var(--c,#7c5cff);border-radius:14px;padding:13px 15px 14px;margin-bottom:10px}
.day-name{font-weight:700;font-size:13.5px;color:#fff;text-transform:uppercase;letter-spacing:.04em;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.day-name::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c,#7c5cff);box-shadow:0 0 8px var(--c,#7c5cff)}
.day-tasks{list-style:none;display:flex;flex-direction:column;gap:6px}
.task{display:flex;align-items:center;gap:9px;padding:9px 12px;background:rgba(7,9,26,.55);border-radius:9px;font-size:13px;line-height:1.35;color:#e8ecf4;text-align:left;width:100%}
.task.editable:active{background:rgba(7,9,26,.85)}
.task.add{background:transparent;border:1px dashed #2a3552;color:#8b95a8;justify-content:center;margin-top:2px}
.task.add:active{background:rgba(124,92,255,.08);color:#cfb6ff;border-color:rgba(124,92,255,.5)}
.task-i{flex-shrink:0;font-size:14px}
.task-lbl{flex:1;min-width:0}
.task-chev{margin-left:auto;color:#5d6779;font-size:14px;flex-shrink:0}
.daily-tag.editable:active{background:rgba(124,92,255,.28)}
.daily-tag.add{background:transparent;border:1px dashed rgba(124,92,255,.4);color:#cfb6ff}
.daily-tag.add:active{background:rgba(124,92,255,.18)}
/* fab */
.fab{position:fixed;bottom:max(20px,env(safe-area-inset-bottom));right:18px;z-index:20;width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#7c5cff,#00d4ff);color:#fff;font-size:26px;font-weight:600;box-shadow:0 14px 30px -8px rgba(124,92,255,.55);display:flex;align-items:center;justify-content:center}
.fab:active{transform:scale(.95)}
.lock-btn{position:fixed;bottom:max(20px,env(safe-area-inset-bottom));left:18px;z-index:20;width:46px;height:46px;border-radius:50%;background:rgba(20,27,45,.95);border:1px solid #2a3552;display:flex;align-items:center;justify-content:center;font-size:17px;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.lock-btn:active{background:#2a3552}
/* sheets */
.sheet{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;justify-content:flex-end;pointer-events:none}
.sheet.open{pointer-events:auto}
.sheet-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.55);opacity:0;transition:opacity .22s}
.sheet.open .sheet-backdrop{opacity:1}
.sheet-card{position:relative;background:#0f1422;border-radius:22px 22px 0 0;max-height:90vh;display:flex;flex-direction:column;border-top:1px solid rgba(255,255,255,.08);transform:translateY(100%);transition:transform .25s cubic-bezier(.32,.72,0,1);padding-bottom:env(safe-area-inset-bottom)}
.sheet.open .sheet-card{transform:translateY(0)}
.sheet-handle{width:38px;height:4px;background:#2a3552;border-radius:2px;margin:8px auto 0}
.sheet-head{display:flex;align-items:center;gap:12px;padding:10px 16px 8px}
.sheet-head h2{flex:1;font-size:18px;font-weight:700;text-align:center}
.x{width:34px;height:34px;display:flex;align-items:center;justify-content:center;font-size:18px;border-radius:9px;color:#8b95a8}
.x:active{background:#1f2740}
.sheet-body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:6px 16px 20px}
/* forms */
.form{display:flex;flex-direction:column;gap:6px}
.lbl{font-size:11.5px;font-weight:700;color:#8b95a8;letter-spacing:.05em;text-transform:uppercase;margin-top:10px;margin-bottom:2px;padding-left:2px}
.ipt{width:100%;padding:13px 14px;background:#171f36;border:1px solid #2a3552;border-radius:11px;font-size:15.5px;color:#fff}
.ipt:focus{border-color:#7c5cff;background:#1c2440}
.ipt.center{text-align:center;font-size:24px;padding:8px 10px;width:64px;height:50px;flex-shrink:0}
.ipt.area{min-height:84px;resize:vertical;font-family:inherit}
.ipt.picker{text-align:left;display:flex;align-items:center;gap:8px;font-size:15px}
.row-2{display:flex;gap:10px;align-items:flex-start}
.row-pw{display:flex;gap:8px}
.row-pw .ipt{flex:1;font-family:"SF Mono",Menlo,Consolas,monospace}
.row-pw .mini{font-size:17px;padding:0 14px;display:flex;align-items:center;justify-content:center}
.icon-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;flex:1}
.ip{padding:6px 0;background:#171f36;border:1px solid #2a3552;border-radius:8px;font-size:18px}
.ip:active{background:#2a3552}
.color-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-top:4px}
.cl{aspect-ratio:1;border-radius:50%;border:2px solid transparent;transition:transform .12s}
.cl.on{border-color:#fff;transform:scale(1.08)}
.form-actions{display:flex;gap:10px;margin-top:18px}
.form-actions>*{flex:1}
/* category picker rows */
.cat-list{display:flex;flex-direction:column;gap:6px}
.cat-row{display:flex;align-items:center;gap:12px;padding:13px 14px;background:#171f36;border:1px solid #2a3552;border-radius:12px;text-align:left;width:100%}
.cat-row:active{background:#1c2440}
.cat-row.active{border-color:#7c5cff;background:#1c2440}
.cat-row.new{background:rgba(124,92,255,.18);border-color:rgba(124,92,255,.4);color:#d9c9ff}
.cat-row-ico{width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:10px;font-size:18px;background:rgba(124,92,255,.18);flex-shrink:0}
.cat-row-name{flex:1;font-weight:600;font-size:15px;color:#fff}
.cat-row.new .cat-row-name{color:#d9c9ff}
.cat-row-n{color:#8b95a8;font-size:13px}
/* settings rows */
.setting-row{display:flex;align-items:center;gap:14px;padding:14px;background:#171f36;border:1px solid #2a3552;border-radius:12px;text-align:left;width:100%;margin-bottom:8px}
.setting-row:active{background:#1c2440}
.sr-ico{font-size:22px;flex-shrink:0;width:38px;height:38px;display:flex;align-items:center;justify-content:center;background:rgba(124,92,255,.18);border-radius:10px}
.sr-txt{flex:1;min-width:0}
.sr-name{font-weight:600;font-size:15px;color:#fff}
.sr-sub{color:#8b95a8;font-size:12.5px;margin-top:2px;line-height:1.35}
.setting-info{padding:14px;background:rgba(7,9,26,.5);border-radius:12px;margin-top:8px}
.setting-info .sr-name{margin-bottom:6px}
/* dirty badge */
.dirty-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#ffb547;margin-left:4px;vertical-align:middle;box-shadow:0 0 8px #ffb547}
/* toast */
#toasts{position:fixed;bottom:max(86px,env(safe-area-inset-bottom));left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:6px;z-index:200;pointer-events:none}
.toast{padding:11px 18px;border-radius:11px;background:rgba(0,200,150,.95);color:#fff;font-weight:600;font-size:14px;box-shadow:0 10px 30px -10px rgba(0,0,0,.6);animation:up .2s}
.toast.err{background:rgba(255,90,108,.95)}
@keyframes up{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
</style>
</head>
<body>

<div id="lock" class="lock">
  <div class="lock-card">
    <div class="lock-emoji">🔐</div>
    <h1>Coffre</h1>
    <p class="lock-sub">Entre ton mot de passe maître</p>
    <div id="unlock">
      <div class="field">
        <input id="mp" type="password" placeholder="Mot de passe maître" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" />
        <button type="button" class="eye" id="eye" aria-label="Afficher">👁</button>
      </div>
      <button type="button" class="btn" id="unlockBtn">Déverrouiller</button>
      <p id="err" class="err"></p>
    </div>
    <p class="lock-foot">🔒 Chiffré · hors-ligne · sur ce téléphone</p>
  </div>
</div>

<div id="app" class="app" hidden>
  <div class="topbar">
    <div class="tab-row">
      <div class="tabs">
        <button class="tab active" data-tab="vault">🔐 Coffre</button>
        <button class="tab" data-tab="plan">📅 Planning</button>
      </div>
      <button class="gear" id="settingsBtn" aria-label="Réglages">⚙️</button>
    </div>
    <div class="search-row" id="searchRow"><input id="search" type="search" placeholder="Rechercher…" autocomplete="off" autocapitalize="off" /></div>
  </div>
  <div id="cats" class="cats"></div>
  <div class="scroll" id="scroll">
    <div id="vaultView" class="list"></div>
    <div id="planView" hidden></div>
  </div>
</div>

<button id="fab" class="fab" hidden aria-label="Ajouter">+</button>
<button id="lockBtn" class="lock-btn" hidden aria-label="Verrouiller">🔒</button>
<div id="toasts"></div>

<script>
"use strict";
const VAULT_DATA = "__VAULT_DATA__";
const STORAGE_KEY = "coffre-vault-v1";
const AUTO_LOCK_MS = 15*60*1000;
const ITER = 250000;

const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const enc = new TextEncoder(), dec = new TextDecoder();
const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const b64e = buf => btoa(String.fromCharCode.apply(null, new Uint8Array(buf)));
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);

let vault = null, mp = null, dirty = false;
let view = "vault", cat = "all", q = "", openId = null;
let lockTimer = null, formCategory = null, editingId = null;
let formAttachments = [];
const MAX_FILE_BYTES = 3 * 1024 * 1024; // 3 Mo par fichier
const sheetStack = [];

const ICONS_QUICK = ["🔑","📷","✉️","🎮","🏦","💳","📱","💬","🎬","🛒","💻","🤖","📺","🎵","📚","🎨","⚙️","🌐","🔒","📝","🏠"];
const COLORS = ["#7c5cff","#00d4ff","#ff6b9d","#4facfe","#00c896","#ffb547","#ff7585","#9146ff","#a8a8a8","#e50914","#ff8800","#3aa8ff","#ffd54f","#43d692"];

async function deriveKey(pw, salt, iter){
  const baseKey = await crypto.subtle.importKey("raw", enc.encode(pw), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2", salt, iterations:iter, hash:"SHA-256"}, baseKey, {name:"AES-GCM", length:256}, false, ["encrypt","decrypt"]);
}
async function decryptBlob(pw, blob){
  const key = await deriveKey(pw, b64d(blob.salt), blob.iterations||ITER);
  const plain = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64d(blob.iv)}, key, b64d(blob.data));
  return JSON.parse(dec.decode(plain));
}
async function encryptVault(v, pw){
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await deriveKey(pw, salt, ITER);
  const ct = await crypto.subtle.encrypt({name:"AES-GCM", iv}, key, enc.encode(JSON.stringify(v)));
  return {version:1, algo:"AES-256-GCM", kdf:"PBKDF2-SHA256", iterations:ITER, salt:b64e(salt), iv:b64e(iv), data:b64e(ct)};
}
async function loadVault(pw){
  const stored = localStorage.getItem(STORAGE_KEY);
  if(stored){ try{ const v = await decryptBlob(pw, JSON.parse(stored)); dirty = true; return v; }catch{} }
  return await decryptBlob(pw, JSON.parse(atob(VAULT_DATA)));
}
async function persist(){
  if(!vault || !mp) return;

function bindCardRows(card, e){

  });

function openAttachment(a){
  if(!a) return;
  try{
    // data URL -> Blob -> ouverture dans un nouvel onglet (marche hors-ligne)
    const parts = a.data.split(",");
    const mime = (parts[0].match(/:(.*?);/) || [,a.type||"application/octet-stream"])[1];
    const bin = atob(parts[1]);
    const arr = new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
    const blob = new Blob([arr], {type: mime});
    const url = URL.createObjectURL(blob);
    const w = window.open(url, "_blank");
    if(!w){
      // popup bloqué : on télécharge à la place
      const link = document.createElement("a");
      link.href = url; link.download = a.name || "fichier";
      document.body.appendChild(link); link.click(); link.remove();
    }
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  }catch(err){ console.error(err); toast("Impossible d'ouvrir le fichier", "err"); }
}

function genPassword(len){
  const chars = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%&*";

  return out;
}

    };
    vault.categories.push(newCat); formCategory = newCat.id;
    await persist(); closeSheet(sheet); refreshEntryFormCategory();
    toast("Catégorie créée ✓");
  };
  sheet.querySelectorAll("[data-close]").forEach(b => b.onclick = () => closeSheet(sheet));
}
function confirmDelete(e){
  const html = '<p style="text-align:center;color:#cfd6e8;margin:0 0 20px;padding:10px">Supprimer <strong>' + esc(e.name) + '</strong> ?<br/><span style="color:#8b95a8;font-size:13px">Cette action est définitive.</span></p>' +
    '<div class="form-actions"><button type="button" class="btn-2nd" data-close>Annuler</button><button type="button" class="btn danger" id="d-confirm">Supprimer</button></div>';
  const sheet = openSheet("Confirmer", html);
  sheet.querySelector("#d-confirm").onclick = async () => {
    vault.entries = vault.entries.filter(x => x.id !== e.id);
    await persist(); closeAllSheets(); renderApp();
    toast("Supprimé ✓");
  };
  sheet.querySelectorAll("[data-close]").forEach(b => b.onclick = () => closeSheet(sheet));
}

function renderPlanning(){
  const p = vault.planning;
  if(!p){
    $("#planView").innerHTML = '<div class="empty"><div class="empty-i">📅</div><h2>Pas de planning</h2><p>Demande à Claude d\'ajouter un planning.</p></div>';
    return;
  }
  const dailyHtml = (p.daily||[]).map((d,i) =>
    '<button class="daily-tag editable" data-ed="' + i + '">' + (d.icon||"") + ' ' + esc(d.label) + '</button>'
  ).join("") + '<button class="daily-tag add" data-ad>➕ Ajouter</button>';
  const daysHtml = (p.days||[]).map((d, dIdx) => {
    const safe = /^#[0-9a-fA-F]{3,8}$/.test(d.color||"") ? d.color : "#7c5cff";
    const tasksHtml = (d.tasks||[]).map((t, tIdx) =>
      '<button class="task editable" data-et="' + dIdx + '-' + tIdx + '"><span class="task-i">' + (t.icon||"•") + '</span><span class="task-lbl">' + esc(t.label) + '</span><span class="task-chev">›</span></button>'
    ).join("") +
    '<button class="task add" data-at="' + dIdx + '"><span class="task-i">➕</span><span class="task-lbl">Ajouter une tâche</span></button>';
    return '<div class="day" style="--c:' + safe + '"><div class="day-name">' + esc(d.name) + '</div><div class="day-tasks">' + tasksHtml + '</div></div>';
  }).join("");
  $("#planView").innerHTML = '<div class="plan-head"><div class="plan-title">📅 ' + esc(p.title||"Planning") + '</div><div class="daily"><div class="daily-lab">🔁 Tous les jours</div><div class="daily-tags">' + dailyHtml + '</div></div></div><div class="days">' + daysHtml + '</div>';
  $$("[data-et]").forEach(b => b.onclick = () => { const p2 = b.dataset.et.split("-").map(Number); showEditTask(p2[0], p2[1]); });
  $$("[data-at]").forEach(b => b.onclick = () => showAddTask(+b.dataset.at));
  $$("[data-ed]").forEach(b => b.onclick = () => showEditDaily(+b.dataset.ed));
  $$("[data-ad]").forEach(b => b.onclick = () => showAddDaily());
}

function taskFormHTML(task){
  task = task || {};
  const isEdit = !!task.label;
  return '<div class="form">' +
    '<label class="lbl">Icône</label>' +
    '<div class="row-2"><input class="ipt center" id="t-icon" value="' + esc(task.icon||"") + '" placeholder="•" maxlength="4" />' +
    '<div class="icon-grid">' + ICONS_QUICK.map(i => '<button type="button" class="ip" data-ic="' + i + '">' + i + '</button>').join("") + '</div></div>' +
    '<label class="lbl">Texte *</label>' +
    '<input class="ipt" id="t-label" value="' + esc(task.label||"") + '" placeholder="Ex : Faire les courses" autocapitalize="sentences" />' +
    '<div class="form-actions">' +
      '<button type="button" class="btn-2nd" data-close>Annuler</button>' +
      (isEdit ? '<button type="button" class="btn danger" id="t-del">🗑️</button>' : '') +
      '<button type="button" class="btn" id="t-save">Enregistrer</button>' +
    '</div></div>';
}
function bindTaskForm(ctx){
  const sheet = sheetStack[sheetStack.length-1]; if(!sheet) return;
  sheet.querySelectorAll(".ip").forEach(b => b.onclick = () => { sheet.querySelector("#t-icon").value = b.dataset.ic; });
  sheet.querySelector("#t-save").onclick = async () => {
    const label = sheet.querySelector("#t-label").value.trim();
    if(!label){ toast("Donne un texte","err"); return; }
    const t = { icon: sheet.querySelector("#t-icon").value.trim() || "•", label };
    if(!vault.planning) vault.planning = { title:"Planning", daily:[], days:[] };
    if(ctx.type === "day"){
      const day = vault.planning.days[ctx.dIdx];
      if(!day.tasks) day.tasks = [];
      if(ctx.tIdx < 0) day.tasks.push(t); else day.tasks[ctx.tIdx] = t;
    }else{
      if(!vault.planning.daily) vault.planning.daily = [];
      if(ctx.idx < 0) vault.planning.daily.push(t); else vault.planning.daily[ctx.idx] = t;
    }
    await persist(); closeAllSheets(); renderApp(); toast("Sauvegardé ✓");
  };
  const del = sheet.querySelector("#t-del");
  if(del) del.onclick = async () => {
    if(ctx.type === "day") vault.planning.days[ctx.dIdx].tasks.splice(ctx.tIdx, 1);
    else vault.planning.daily.splice(ctx.idx, 1);
    await persist(); closeAllSheets(); renderApp(); toast("Supprimé ✓");
  };
  sheet.querySelectorAll("[data-close]").forEach(b => b.onclick = () => closeAllSheets());
}
function showEditTask(dIdx, tIdx){
  const d = vault.planning.days[dIdx]; const t = d.tasks[tIdx];
  openSheet("Tâche · " + d.name, taskFormHTML(t));
  bindTaskForm({type:"day", dIdx, tIdx});
}
function showAddTask(dIdx){
  const d = vault.planning.days[dIdx];
  openSheet("Nouvelle tâche · " + d.name, taskFormHTML(null));
  bindTaskForm({type:"day", dIdx, tIdx:-1});
}
function showEditDaily(idx){
  const t = vault.planning.daily[idx];
  openSheet("Tâche quotidienne", taskFormHTML(t));
  bindTaskForm({type:"daily", idx});
}
function showAddDaily(){
  openSheet("Nouvelle tâche quotidienne", taskFormHTML(null));
  bindTaskForm({type:"daily", idx:-1});
}

function showSettings(){
  const html = '<div class="form">' +
    '<button class="setting-row" id="s-export"><div class="sr-ico">📤</div><div class="sr-txt"><div class="sr-name">Exporter mon fichier' + (dirty?' <span class="dirty-dot" style="margin-left:6px"></span>':'') + '</div><div class="sr-sub">Télécharge un nouveau coffre-mobile.html avec tes modifs. Remplace-le sur iCloud Drive pour synchroniser tes appareils.</div></div></button>' +
    '<button class="setting-row" id="s-reset"><div class="sr-ico">🔄</div><div class="sr-txt"><div class="sr-name">Annuler mes modifications locales</div><div class="sr-sub">Revenir aux données initiales du fichier.</div></div></button>' +
    '<div class="setting-info"><div class="sr-name">À propos</div><div class="sr-sub">' + vault.entries.length + ' entrée(s) · ' + vault.categories.length + ' catégorie(s)</div><div class="sr-sub">Chiffrement AES-256-GCM · PBKDF2 250 000 itérations</div><div class="sr-sub">Auto-verrouillage : 15 min sans activité</div></div>' +
    '</div>';
  const sheet = openSheet("Réglages", html);
  sheet.querySelector("#s-export").onclick = () => doExport();
  sheet.querySelector("#s-reset").onclick = () => confirmReset();
}
async function doExport(){
  try{
    const blob = await encryptVault(vault, mp);
    const b64 = btoa(JSON.stringify(blob));
    let html = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
    html = html.replace(/const VAULT_DATA = "[A-Za-z0-9+\/=]*";/, 'const VAULT_DATA = "' + b64 + '";');
    const file = new Blob([html], {type: "text/html"});
    const url = URL.createObjectURL(file);
    const a = document.createElement("a");
    a.href = url; a.download = "coffre-mobile.html";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    toast("Fichier exporté ✓");
    closeAllSheets();
  }catch(err){ console.error(err); toast("Erreur d'export", "err"); }
}
function confirmReset(){
  const html = '<p style="text-align:center;color:#cfd6e8;margin:0 0 20px;padding:10px">Cela va effacer <strong>toutes</strong> les modifications locales et revenir aux données initiales du fichier.<br/><span style="color:#8b95a8;font-size:13px">Tu devras ré-entrer ton mot de passe.</span></p>' +
    '<div class="form-actions"><button type="button" class="btn-2nd" data-close>Annuler</button><button type="button" class="btn danger" id="r-confirm">Réinitialiser</button></div>';
  const sheet = openSheet("Confirmer", html);
  sheet.querySelector("#r-confirm").onclick = () => {
    localStorage.removeItem(STORAGE_KEY); dirty = false;
    closeAllSheets(); lock();
  };
  sheet.querySelectorAll("[data-close]").forEach(b => b.onclick = () => closeSheet(sheet));
}

setTimeout(() => $("#mp").focus(), 200);
</script>
